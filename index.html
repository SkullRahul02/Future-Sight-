<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Future Scanner</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: linear-gradient(180deg, #000 0%, #071018 100%);
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
      position: relative;
    }
    
    #space-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    
    .astrology-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    
    .zodiac {
      position: absolute;
      font-size: 60px;
      opacity: 0.08;
      animation: float 8s infinite ease-in-out;
    }
    
    .zodiac1 { top: 5%; left: 5%; animation-delay: 0s; }
    .zodiac2 { top: 15%; right: 8%; animation-delay: 1s; }
    .zodiac3 { top: 50%; left: 3%; animation-delay: 2s; }
    .zodiac4 { bottom: 10%; right: 5%; animation-delay: 3s; }
    .zodiac5 { top: 60%; right: 10%; animation-delay: 1.5s; }
    .zodiac6 { top: 25%; right: 20%; animation-delay: 2.5s; }
    .zodiac7 { bottom: 20%; left: 15%; animation-delay: 0.5s; }
    .zodiac8 { top: 40%; left: 10%; animation-delay: 3.5s; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.08; }
      50% { transform: translateY(30px) rotate(10deg); opacity: 0.15; }
    }
    
    .orbit {
      position: absolute;
      border: 1px solid rgba(6, 182, 212, 0.1);
      border-radius: 50%;
    }
    
    .orbit1 {
      width: 300px;
      height: 300px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: rotate 20s linear infinite;
    }
    
    .orbit2 {
      width: 500px;
      height: 500px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: rotate 30s linear infinite reverse;
    }
    
    .orbit3 {
      width: 700px;
      height: 700px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: rotate 40s linear infinite;
    }
    
    @keyframes rotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    
    .planet {
      position: absolute;
      border-radius: 50%;
      opacity: 0.6;
    }
    
    .planet1 {
      width: 8px;
      height: 8px;
      background: #06b6d4;
      top: 50%;
      left: calc(50% + 150px);
      box-shadow: 0 0 15px #06b6d4;
      animation: orbit1-move 20s linear infinite;
    }
    
    .planet2 {
      width: 6px;
      height: 6px;
      background: #16a34a;
      top: 50%;
      left: calc(50% + 250px);
      box-shadow: 0 0 12px #16a34a;
      animation: orbit2-move 30s linear infinite reverse;
    }
    
    @keyframes orbit1-move {
      0% { left: calc(50% + 150px); top: 50%; }
      100% { left: calc(50% + 150px); top: 50%; }
    }
    
    @keyframes orbit2-move {
      0% { left: calc(50% + 250px); top: 50%; }
      100% { left: calc(50% + 250px); top: 50%; }
    }
    
    .constellation {
      position: absolute;
      width: 200px;
      height: 200px;
      opacity: 0.05;
    }
    
    .constellation1 { top: 10%; left: 10%; }
    .constellation2 { top: 10%; right: 10%; }
    .constellation3 { bottom: 10%; left: 10%; }
    .constellation4 { bottom: 10%; right: 10%; }
    
    .constellation line {
      stroke: #06b6d4;
      stroke-width: 0.5;
    }
    
    .container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      padding: 20px;
    }
    
    .card {
      width: 100%;
      max-width: 550px;
      background: rgba(10, 30, 45, 0.7);
      border: 2px solid #06b6d4;
      border-radius: 20px;
      padding: 50px 40px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(6, 182, 212, 0.3), inset 0 0 30px rgba(6, 182, 212, 0.05);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #16a34a, transparent);
      animation: scanTop 3s infinite;
    }
    
    .card::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #06b6d4, transparent);
      animation: scanBottom 3s infinite reverse;
    }
    
    @keyframes scanTop {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    
    @keyframes scanBottom {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    
    .card-header {
      margin-bottom: 10px;
    }
    
    .scanner-label {
      font-size: 11px;
      color: #06b6d4;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .scanner-label::before {
      content: '✦';
      color: #16a34a;
      font-size: 12px;
    }
    
    .scanner-label::after {
      content: '✦';
      color: #16a34a;
      font-size: 12px;
    }
    
    h1 {
      font-size: 32px;
      margin: 0 auto 8px auto;
      color: #00ff88;
      text-align: center;
      letter-spacing: 3px;
      text-shadow: 0 0 20px #16a34a, 0 0 40px #06b6d4;
      font-weight: bold;
    }
    
    .subtitle {
      font-size: 12px;
      color: #06b6d4;
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
    }
    
    #message {
      font-size: 16px;
      margin-bottom: 25px;
      color: #b0ffcc;
      text-align: center;
      line-height: 1.5;
      font-weight: 500;
    }
    
    #startBtn {
      padding: 16px 50px;
      font-size: 16px;
      border: 2px solid #16a34a;
      border-radius: 8px;
      background: rgba(22, 163, 74, 0.1);
      color: #00ff88;
      cursor: pointer;
      margin-bottom: 25px;
      transition: all 0.3s;
      display: block;
      margin-left: auto;
      margin-right: auto;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(22, 163, 74, 0.3), inset 0 0 10px rgba(22, 163, 74, 0.1);
    }
    
    #startBtn:hover {
      background: rgba(22, 163, 74, 0.3);
      box-shadow: 0 0 25px rgba(22, 163, 74, 0.6), inset 0 0 15px rgba(22, 163, 74, 0.2);
      transform: translateY(-2px);
    }
    
    #startBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #startBtn:active {
      transform: translateY(0);
    }
    
    #status {
      font-size: 14px;
      min-height: 30px;
      margin: 15px 0;
      color: #06b6d4;
      text-align: center;
      letter-spacing: 1px;
      font-weight: 500;
    }
    
    .bar {
      width: 100%;
      height: 8px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 25px;
      display: none;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
    }
    
    .bar > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #16a34a, #06b6d4);
      transition: width 100ms linear;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.5);
    }
    
    .hand-container {
      margin: 35px auto;
      width: 300px;
      height: 380px;
      display: none;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    
    .scanner-frame {
      position: absolute;
      width: 320px;
      height: 400px;
      border: 2px solid rgba(6, 182, 212, 0.4);
      border-radius: 15px;
      display: none;
    }
    
    .scanner-frame.active {
      display: block;
      animation: frameGlow 1.5s infinite;
    }
    
    @keyframes frameGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }
      50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.6); }
    }
    
    .hand-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 25px rgba(22, 163, 74, 0.7)) drop-shadow(0 0 15px rgba(6, 182, 212, 0.5));
    }
    
    .scan-line {
      stroke: url(#scanGradient);
      stroke-width: 10;
      stroke-linecap: round;
      opacity: 0.95;
      animation: scanLine 2.5s linear infinite;
      filter: drop-shadow(0 0 8px #06b6d4);
    }
    
    @keyframes scanLine {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(300px); }
    }
    
    .data-points {
      stroke: #16a34a;
      fill: none;
      stroke-width: 2;
      opacity: 0;
      animation: dataPoint 2.5s ease-in-out infinite;
    }
    
    @keyframes dataPoint {
      0% { opacity: 0; }
      50% { opacity: 1; }
      100% { opacity: 0; }
    }
    
    .tech-info {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      font-size: 11px;
      color: #06b6d4;
      padding: 0 20px;
    }
    
    .tech-item {
      text-align: center;
    }
    
    .tech-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
      opacity: 0.7;
    }
    
    .tech-value {
      font-size: 13px;
      color: #00ff88;
      font-weight: bold;
    }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeIn 0.4s;
      backdrop-filter: blur(5px);
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .modal {
      background: rgba(10, 20, 30, 0.95);
      border: 2px solid #06b6d4;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      position: relative;
      max-width: 90%;
      box-shadow: 0 0 50px rgba(6, 182, 212, 0.5), inset 0 0 20px rgba(6, 182, 212, 0.1);
      animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    @keyframes modalPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 32px;
      color: #06b6d4;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .close-btn:hover {
      color: #16a34a;
      transform: scale(1.3) rotate(90deg);
    }
    
    .modal h3 {
      color: #00ff88;
      margin-bottom: 25px;
      font-size: 24px;
      text-shadow: 0 0 15px #16a34a;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    .modal iframe {
      width: 100%;
      max-width: 550px;
      height: 330px;
      border-radius: 10px;
      border: 2px solid #06b6d4;
      margin: 20px 0;
      background: #000;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }
    
    @media (max-width: 480px) {
      .card {
        padding: 35px 25px;
        max-width: 95%;
      }
      
      h1 {
        font-size: 24px;
      }
      
      .hand-container {
        width: 220px;
        height: 280px;
      }
      
      .scanner-frame {
        width: 240px;
        height: 300px;
      }
      
      .modal {
        padding: 25px;
      }
      
      .modal iframe {
        height: 220px;
      }
    }
  </style>
</head>
<body>
  <canvas id="space-bg"></canvas>
  
  <!-- Astrology Background Elements -->
  <div class="astrology-bg">
    <!-- Zodiac Signs Floating -->
    <div class="zodiac zodiac1">♈</div>
    <div class="zodiac zodiac2">♉</div>
    <div class="zodiac zodiac3">♊</div>
    <div class="zodiac zodiac4">♋</div>
    <div class="zodiac zodiac5">♌</div>
    <div class="zodiac zodiac6">♍</div>
    <div class="zodiac zodiac7">♎</div>
    <div class="zodiac zodiac8">♏</div>
    
    <!-- Orbital Rings -->
    <div class="orbit orbit1"></div>
    <div class="orbit orbit2"></div>
    <div class="orbit orbit3"></div>
    
    <!-- Planets in Orbit -->
    <div class="planet planet1"></div>
    <div class="planet planet2"></div>
    
    <!-- Constellations -->
    <svg class="constellation constellation1" viewBox="0 0 200 200">
      <line x1="20" y1="20" x2="80" y2="50"/>
      <line x1="80" y1="50" x2="150" y2="40"/>
      <line x1="150" y1="40" x2="180" y2="100"/>
      <circle cx="20" cy="20" r="3" fill="#06b6d4"/>
      <circle cx="80" cy="50" r="3" fill="#06b6d4"/>
      <circle cx="150" cy="40" r="3" fill="#06b6d4"/>
      <circle cx="180" cy="100" r="3" fill="#06b6d4"/>
    </svg>
    
    <svg class="constellation constellation2" viewBox="0 0 200 200">
      <line x1="30" y1="170" x2="100" y2="120"/>
      <line x1="100" y1="120" x2="170" y2="150"/>
      <line x1="170" y1="150" x2="190" y2="80"/>
      <circle cx="30" cy="170" r="3" fill="#06b6d4"/>
      <circle cx="100" cy="120" r="3" fill="#06b6d4"/>
      <circle cx="170" cy="150" r="3" fill="#06b6d4"/>
      <circle cx="190" cy="80" r="3" fill="#06b6d4"/>
    </svg>
    
    <svg class="constellation constellation3" viewBox="0 0 200 200">
      <line x1="50" y1="30" x2="120" y2="80"/>
      <line x1="120" y1="80" x2="160" y2="50"/>
      <line x1="160" y1="50" x2="170" y2="120"/>
      <circle cx="50" cy="30" r="3" fill="#06b6d4"/>
      <circle cx="120" cy="80" r="3" fill="#06b6d4"/>
      <circle cx="160" cy="50" r="3" fill="#06b6d4"/>
      <circle cx="170" cy="120" r="3" fill="#06b6d4"/>
    </svg>
    
    <svg class="constellation constellation4" viewBox="0 0 200 200">
      <line x1="40" y1="160" x2="110" y2="110"/>
      <line x1="110" y1="110" x2="180" y2="140"/>
      <line x1="180" y1="140" x2="160" y2="70"/>
      <circle cx="40" cy="160" r="3" fill="#06b6d4"/>
      <circle cx="110" cy="110" r="3" fill="#06b6d4"/>
      <circle cx="180" cy="140" r="3" fill="#06b6d4"/>
      <circle cx="160" cy="70" r="3" fill="#06b6d4"/>
    </svg>
  </div>
  
  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="scanner-label">Biometric Scanner</div>
        <h1>FUTURE SCANNER</h1>
        <div class="subtitle">Advanced Predictive System v2.1</div>
      </div>
      
      <div id="message">To see your future, place your palm on the scanner and click START</div>
      <button id="startBtn">➤ START SCAN</button>
      <div id="status"></div>
      
      <div class="hand-container" id="handContainer">
        <div class="scanner-frame" id="scannerFrame"></div>
        <svg class="hand-svg" viewBox="0 0 150 210" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0" />
              <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0" />
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          
          <!-- Palm -->
          <ellipse cx="75" cy="130" rx="40" ry="55" fill="#0a3a1a" stroke="#00ff88" stroke-width="2.5"/>
          
          <!-- Fingers -->
          <rect x="35" y="10" width="11" height="75" rx="5" fill="#0a3a1a" stroke="#00ff88" stroke-width="2"/>
          <rect x="52" y="5" width="12" height="85" rx="6" fill="#0a3a1a" stroke="#00dd77" stroke-width="2"/>
          <rect x="70" y="2" width="12" height="90" rx="6" fill="#0a3a1a" stroke="#00ff88" stroke-width="2"/>
          <rect x="88" y="5" width="12" height="85" rx="6" fill="#0a3a1a" stroke="#00dd77" stroke-width="2"/>
          <rect x="105" y="10" width="11" height="75" rx="5" fill="#0a3a1a" stroke="#00ff88" stroke-width="2"/>
          
          <!-- Palm lines (major lines) -->
          <path d="M50 100 Q75 115 85 140" stroke="#00dd77" stroke-width="2" opacity="0.9" filter="url(#glow)"/>
          <path d="M60 85 Q70 95 75 105" stroke="#00ffaa" stroke-width="1.5" opacity="0.8"/>
          <path d="M90 85 Q80 95 75 105" stroke="#00ffaa" stroke-width="1.5" opacity="0.8"/>
          
          <!-- Data points (hexagons) -->
          <g class="data-points">
            <circle cx="60" cy="80" r="3" fill="#16a34a"/>
            <circle cx="75" cy="65" r="3" fill="#16a34a"/>
            <circle cx="90" cy="75" r="3" fill="#16a34a"/>
            <circle cx="70" cy="110" r="3" fill="#16a34a"/>
            <circle cx="80" cy="120" r="3" fill="#16a34a"/>
          </g>
          
          <!-- Scanning line -->
          <line id="scanLine" class="scan-line" x1="30" y1="20" x2="120" y2="20"/>
        </svg>
      </div>
      
      <div class="bar"><div id="barFill"></div></div>
      
      <div class="tech-info" id="techInfo" style="display: none;">
        <div class="tech-item">
          <div class="tech-label">Resolution</div>
          <div class="tech-value">1080p</div>
        </div>
        <div class="tech-item">
          <div class="tech-label">Status</div>
          <div class="tech-value">Active</div>
        </div>
        <div class="tech-item">
          <div class="tech-label">Accuracy</div>
          <div class="tech-value">98%</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize starfield
    const canvas = document.getElementById('space-bg');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    
    const stars = [];
    for (let i = 0; i < 200; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 0.8 + 0.2,
        opacity: Math.random() * 0.5 + 0.2,
        tSpeed: Math.random() * 0.02 + 0.005
      });
    }
    
    function drawStars() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
        ctx.shadowColor = '#aef6fe';
        ctx.shadowBlur = 12;
        ctx.fill();
        
        star.opacity += (Math.random() - 0.5) * star.tSpeed;
        if (star.opacity > 0.8) star.opacity = 0.8;
        if (star.opacity < 0.15) star.opacity = 0.15;
      });
      
      ctx.shadowBlur = 0;
      requestAnimationFrame(drawStars);
    }
    
    drawStars();
    
    // Scanner logic
    const startBtn = document.getElementById('startBtn');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    const progressBar = document.querySelector('.bar');
    const barFill = document.getElementById('barFill');
    const handContainer = document.getElementById('handContainer');
    const scannerFrame = document.getElementById('scannerFrame');
    const techInfo = document.getElementById('techInfo');
    
    const videos = [
      'https://youtu.be/ULpLvPu3aU0?si=YEPnngZ-P5Tmji-8',
      'https://youtu.be/dOtMlUmTQm4?si=VgdtYxMrz7uHbApU'
    ];
    
    function startScan() {
      message.textContent = '';
      status.innerHTML = '<strong>Place your palm on the scanner...</strong>';
      progressBar.style.display = 'none';
      handContainer.style.display = 'none';
      techInfo.style.display = 'none';
      
      setTimeout(() => {
        status.textContent = 'Scanning palm...';
        progressBar.style.display = 'block';
        barFill.style.width = '0%';
        handContainer.style.display = 'flex';
        scannerFrame.classList.add('active');
        techInfo.style.display = 'flex';
        
        const startTime = Date.now();
        const scanDuration = 10000;
        
        const scanInterval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const percent = Math.min(100, Math.floor((elapsed / scanDuration) * 100));
          barFill.style.width = percent + '%';
          status.textContent = `Scanning palm... ${percent}%`;
          
          if (percent >= 100) clearInterval(scanInterval);
        }, 100);
        
        setTimeout(() => {
          status.textContent = 'Uploading data...';
          handContainer.style.display = 'none';
          scannerFrame.classList.remove('active');
          
          setTimeout(() => {
            status.textContent = 'Analyzing future...';
            
            setTimeout(() => {
              showVideo();
            }, 3000);
          }, 3000);
        }, 10000);
      }, 1500);
    }
    
    function showVideo() {
      const randomVideo = videos[Math.floor(Math.random() * videos.length)];
      
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      
      const modal = document.createElement('div');
      modal.className = 'modal';
      
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-btn';
      closeBtn.innerHTML = '✕';
      closeBtn.onclick = () => {
        overlay.remove();
        resetScanner();
      };
      
      const title = document.createElement('h3');
      title.textContent = 'Your Future Revealed';
      
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${extractVideoId(randomVideo)}?autoplay=1`;
      iframe.frameborder = '0';
      iframe.allow = 'autoplay; encrypted-media';
      iframe.allowFullscreen = true;
      
      modal.appendChild(closeBtn);
      modal.appendChild(title);
      modal.appendChild(iframe);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      
      message.textContent = '';
      status.textContent = '';
      progressBar.style.display = 'none';
    }
    
    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return match && match[2].length === 11 ? match[2] : null;
    }
    
    function resetScanner() {
      message.textContent = 'To see your future, place your palm on the scanner and click START';
      status.textContent = '';
      progressBar.style.display = 'none';
      barFill.style.width = '0%';
      handContainer.style.display = 'none';
      scannerFrame.classList.remove('active');
      techInfo.style.display = 'none';
      startBtn.disabled = false;
      startBtn.style.opacity = '1';
    }
    
    startBtn.addEventListener('click', () => {
      startBtn.disabled = true;
      startBtn.style.opacity = '0.6';
      startScan();
    });
    
    resetScanner();
  </script>
</body>
</html>
