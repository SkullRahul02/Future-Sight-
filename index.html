<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Future Scanner</title>
  <style>
    :root{
      --bg:#000;
      --card:#0b0b0b;
      --accent:#22c55e;
    }
    *{box-sizing:border-box;}
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(180deg,#000 0%, #071018 100%);
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }
    /* Space background with twinkling stars */
    #space-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
      pointer-events: none;
    }
    .stars {
      /* Simulate twinkling stars with CSS animation */
      position: absolute;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: transparent;
      z-index: 0;
    }
    .card{
      z-index: 1;
      position: relative;
      width: 94%;
      max-width: 430px;
      margin: 42px auto 0 auto;
      background: rgba(255,255,255,0.03);
      box-shadow: 0 6px 30px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 34px 24px 34px 24px;
      backdrop-filter: blur(8px);
      text-align: center;
    }
    #message{margin-bottom:20px;font-size:21px;}
    #startBtn{
      padding:14px 32px;
      font-size:20px;
      border-radius:12px;
      border: none;
      background: linear-gradient(90deg,#16a34a,#06b6d4);
      color:#fff;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(3,7,18,0.55);
      margin-bottom:8px;
      transition: box-shadow 0.15s, opacity 0.15s, background 0.15s;
    }
    #startBtn:disabled{opacity:0.5;pointer-events:none;}
    #startBtn:active{transform:translateY(1px);}
    #status{margin-top:10px;font-size:18px;min-height:26px;}
    .bar{
      height:13px;margin-top:13px;
      background:rgba(255,255,255,0.09);
      border-radius:9px;overflow:hidden;
      box-shadow:0 1px 6px #0ff2 0px 2px 12px #0cf8;
      display:none;
    }
    .bar > i{
      display:block;height:100%;width:0%;
      background:linear-gradient(90deg,#16a34a,#06b6d4);
      transition:width 120ms linear;
    }
    .hand-container {
      margin:24px auto 18px auto;
      width: 150px; height: 210px;
      position: relative;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .hand-svg {
      width: 150px; height: 210px; display: block;
      filter: drop-shadow(0px 0px 16px #16a34a88) drop-shadow(0px 0px 16px #50fff088);
    }
    /* Scanning line animation */
    .scan-line {
      stroke: #06b6d4;
      stroke-width: 7;
      stroke-linecap: round;
      opacity: 0.85;
      animation: scan-move 2s linear infinite;
    }
    @keyframes scan-move {
      0%   { transform: translateY(0px); opacity:0.3;}
      20%  { opacity:1; }
      80%  { opacity:1; }
      100% { transform: translateY(190px); opacity:0.1;}
    }

    /* Modal overlay for video */
    .modal-overlay {
      position: fixed;
      z-index: 10;
      left: 0; top: 0;
      width: 100vw; height: 100vh;
      background: rgba(20,30,40,0.77);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: modal-in 0.55s;
    }
    @keyframes modal-in {
      0% {opacity: 0;}
      100% {opacity: 1;}
    }
    .modal {
      background: rgba(12,18,30, 0.95);
      border-radius: 18px;
      padding: 24px 15px 15px 15px;
      text-align:center;
      position:relative;
      min-width: 330px; max-width: 98vw;
      box-shadow: 0 4px 36px #0ff4, 0 1px 8px #16a34a66;
    }
    .modal iframe {
      width: 360px;
      height: 205px;
      border-radius: 10px;
      background: #000;
      border: 2.5px solid #06b6d4;
      margin-bottom:8px;
    }
    @media (max-width: 480px) {
      .modal { min-width: unset; max-width: 99vw; }
      .modal iframe { width: 98vw; height: 178px; }
      .hand-container {width:110px;height:150px;}
      .hand-svg { width:110px; height:150px;}
    }
    .modal h3 {
      color: #16a34a;
      margin: 0 0 12px 0; font-size:21px;
    }
    .close-btn {
      position:absolute;top:9px;right:14px;
      font-size:1.7rem;
      color:#06b6d4;
      cursor:pointer;
      border:none;
      background:transparent;
      outline:none;
      transition: color 0.20s;
      z-index: 2;
    }
    .close-btn:hover {color:#05f5a2;}
  </style>
</head>
<body>
  <canvas id="space-bg"></canvas>
  <div class="card">
    <div id="message">To see your future click on START button</div>
    <button id="startBtn">START</button>
    <div id="status" aria-live="polite"></div>
    <div class="hand-container" id="handContainer" aria-hidden="true">
      <!-- Hand SVG with animated scan line -->
      <svg class="hand-svg" viewBox="0 0 150 210" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Palm background -->
        <path d="M60 180 Q75 205 90 180 L100 80 L120 80 Q125 100 130 130 Q135 175 75 200 Q20 183 30 130 Q35 100 40 80 L60 80 L60 180Z"
              fill="#0f271a"
              stroke="#09ffaa" stroke-width="3"/>
        <!-- Fingers -->
        <rect x="38" y="20" width="10" height="60" rx="5" fill="#122" stroke="#05dacc" stroke-width="2"/>
        <rect x="52" y="7" width="11" height="74" rx="5.7" fill="#122" stroke="#09ffaa" stroke-width="2"/>
        <rect x="67" y="3" width="12" height="78" rx="6" fill="#122" stroke="#0cf" stroke-width="2"/>
        <rect x="85" y="7.5" width="11" height="74" rx="5.5" fill="#122" stroke="#09ffaa" stroke-width="2"/>
        <rect x="99" y="20" width="10" height="60" rx="5" fill="#122" stroke="#05dacc" stroke-width="2"/>
        <!-- Palm lines (for realism) -->
        <path d="M67 130 Q85 135 73 170" stroke="#45e6d4" stroke-width="2" opacity="0.9"/>
        <path d="M60 115 Q62 120 68 125" stroke="#30f8b1" stroke-width="1.4" opacity="0.9"/>
        <path d="M87 115 Q83 123 90 127" stroke="#30f8b1" stroke-width="1.4" opacity="0.9"/>
        <!-- Scanning line -->
        <line id="scanningLine" class="scan-line" x1="36" y1="30" x2="120" y2="30"/>
      </svg>
    </div>
    <div class="bar" id="progressBar"><i id="barFill"></i></div>
  </div>

  <script>
    /*** Space background ***/
    function createStars(ctx, starCount, width, height) {
      for (let i = 0; i < starCount; ++i) {
        let x = Math.random() * width, y = Math.random() * height,
            r = Math.random() * 0.6 + 0.35,
            alpha = Math.random() * 0.55 + 0.4;
        ctx.beginPath();
        ctx.arc(x,y,r,0,2*Math.PI);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.shadowColor = "#aef6fe";
        ctx.shadowBlur = 6;
        ctx.fill(); ctx.shadowBlur = 0;
      }
    }
    function animateStars(canvas, ctx) {
      function render() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        createStars(ctx, 88, canvas.width, canvas.height);
        requestAnimationFrame(render);
      }
      render();
    }
    const bg = document.getElementById('space-bg');
    function resizeBg() {
      bg.width = window.innerWidth; bg.height = window.innerHeight;
    }
    resizeBg();
    window.addEventListener("resize", resizeBg);
    const ctx = bg.getContext("2d");
    animateStars(bg, ctx);
    /*** End Space BG ***/

    // App logic
    const startBtn = document.getElementById('startBtn');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const barFill = document.getElementById('barFill');
    const handContainer = document.getElementById('handContainer');

    // VIDEO POOL: Add more by extending this array
    const videoPool = [
      {
        title: "Future Prediction 1",
        embedUrl: "https://www.youtube.com/embed/ULpLvPu3aU0?autoplay=1"
      },
      {
        title: "Future Prediction 2",
        embedUrl: "https://www.youtube.com/embed/dOtMlUmTQm4?autoplay=1"
      }
    ];

    // Timings (ms)
    const readyPause = 1500;
    const scanningDuration = 10000;
    const uploadingDuration = 3000;
    const loadingDuration = 3000;

    let percentInterval = null;

    function clearProgressIntervals(){
      if(percentInterval) { clearInterval(percentInterval); percentInterval = null; }
    }
    function hideHandDisplay() {
      handContainer.style.display = 'none';
    }
    function showHandDisplay() {
      handContainer.style.display = 'flex';
      // restart scan line animation
      const scanLine = document.getElementById('scanningLine');
      if(scanLine) {
        scanLine.style.animation = 'none';
        // Force reflow
        void scanLine.offsetWidth;
        scanLine.style.animation = null;
      }
    }

    function startSequence(){
      message.textContent = '';
      status.innerHTML = '<strong>Show your palm on the camera</strong>';
      progressBar.style.display = 'none';
      barFill.style.width = '0%';
      hideHandDisplay();

      setTimeout(() => {
        status.textContent = 'Scanning palm...';
        progressBar.style.display = 'block';
        barFill.style.width = '0%';

        showHandDisplay();

        // Animate percent 0 -> 100 over scanningDuration
        const startTime = Date.now();
        percentInterval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const pct = Math.min(100, Math.floor((elapsed / scanningDuration) * 100));
          barFill.style.width = pct + '%';
          status.textContent = `Scanning palm... ${pct}%`;
          if(pct >= 100){
            clearProgressIntervals();
          }
        }, 80);

        setTimeout(() => {
          clearProgressIntervals();
          barFill.style.width = '100%';
          status.textContent = 'Uploading...';

          hideHandDisplay();

          setTimeout(() => {
            status.textContent = 'Loading your future...';
            setTimeout(() => {
              message.textContent = '';
              status.textContent = '';
              progressBar.style.display = 'none';
              popupRandomVideo();

            }, loadingDuration);
          }, uploadingDuration);

        }, scanningDuration);

      }, readyPause);
    }

    // MODAL/POPUP VIDEO
    function popupRandomVideo() {
      const idx = Math.floor(Math.random() * videoPool.length);
      const video = videoPool[idx];

      // Modal markup
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';

      const modal = document.createElement('div');
      modal.className = 'modal';

      // Close button
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-btn';
      closeBtn.innerHTML = '&times;';
      closeBtn.onclick = () => {
        overlay.remove();
        resetScanner();
      };

      // Video title
      const title = document.createElement('h3');
      title.textContent = "Your Future:";

      // Video Embed
      const iframe = document.createElement('iframe');
      iframe.setAttribute('src', video.embedUrl);
      iframe.setAttribute('frameborder','0');
      iframe.setAttribute('allow','autoplay; encrypted-media');
      iframe.setAttribute('allowfullscreen','');
      iframe.setAttribute('title', video.title);

      modal.appendChild(closeBtn);
      modal.appendChild(title);
      modal.appendChild(iframe);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
    }

    function resetScanner() {
      message.textContent = "To see your future click on START button";
      status.textContent = '';
      progressBar.style.display = 'none';
      barFill.style.width = '0%';
      startBtn.disabled = false;
      hideHandDisplay();
    }

    // Attach click handler
    startBtn.addEventListener('click', function(){
      startBtn.disabled = true;
      startBtn.style.opacity = '0.6';
      startSequence();
    });

    // Initialize
    resetScanner();
  </script>
</body>
</html>
