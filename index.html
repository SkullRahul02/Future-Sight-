<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Future Scanner</title>
  <style>
    /* Reset and base */
    html, body {
      height: 100%;
      margin: 0; padding: 0;
      font-family: 'Segoe UI', 'Orbitron', 'Courier New', monospace;
      background: radial-gradient(ellipse at top, #071018 0%, #1C2638 100%) fixed;
      color: #fff;
      overflow: hidden;
    }
    #space-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none;
      background: transparent;
    }
    /* Astrology background */
    .astrology-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0; pointer-events: none;
    }
    .zodiac {
      position: absolute; font-size: 60px; opacity: 0.11; animation: float 9s ease-in-out infinite alternate;
      user-select: none;
    }
    .zodiac1{top:7%; left:6%; color:#f9d371;}
    .zodiac2{top:15%; right:7%; color:#a2e3f6;}
    .zodiac3{top:51%; left:8%; color:#b7a7f2;}
    .zodiac4{bottom:14%; right:6%; color:#ffb6b9;}
    .zodiac5{top:63%; right:12%; color:#a7f2c0;}
    .zodiac6{top:31%; right:22%; color:#f9d371;}
    .zodiac7{bottom:24%; left:10%; color:#b7a7f2;}
    .zodiac8{top:44%; left:13%; color:#a2e3f6;}
    @keyframes float {0%,100%{transform:translateY(0)} 50%{transform:translateY(30px)}}
    /* Constellations */
    .constellation {
      position: absolute; width: 190px; height: 190px; opacity: 0.09; filter: blur(0.5px);
      user-select: none;
    }
    .constellation1{top: 12%; left: 11%;}
    .constellation2{top: 18%; right: 7%;}
    .constellation3{bottom: 6%; left: 8%;}
    .constellation4{bottom: 9%; right: 10%;}
    .constellation circle { fill: #90eeff; }
    .constellation line {
      stroke: #06b6d4; stroke-width: 1.2; opacity: 0.3;
      animation: twinkle 2.5s infinite alternate;
    }
    @keyframes twinkle { from {opacity: 0.3;} to {opacity: 0.6;} }

    /* Rotating Orbits */
    .orbit {
      position: absolute; border-radius: 50%; border: 1.5px solid rgba(6,182,212,0.11);
      user-select: none;
    }
    .orbit1 {
      width: 230px; height: 230px;
      top: 50%; left: 52%;
      transform: translate(-50%, -50%);
      animation: rotate 23s linear infinite;
    }
    .orbit2 {
      width: 390px; height: 390px;
      top: 53%; left: 46%;
      transform: translate(-50%, -50%);
      animation: rotate 34s linear infinite reverse;
    }
    @keyframes rotate {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Container & card */
    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 20px;
    }
    .card {
      position: relative;
      max-width: 540px;
      width: 94vw;
      background: rgba(12, 23, 38, 0.7);
      border-radius: 22px;
      padding: 48px 38px 40px 38px;
      box-shadow: 0 0 58px #00f7c440, 0 0 15px #314fcd22;
      border: 3px solid #06b6d4;
      text-align: center;
      overflow: visible;
      z-index: 3;
    }
    .card-header {
      margin-bottom: 8px;
    }
    .scanner-label {
      font-size: 11px;
      color: #06b6d4;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 5px;
      text-shadow: 0 0 8px #06b6d4cc;
    }
    h1 {
      font-size: 29px;
      margin-bottom: 8px;
      color: #00ff88;
      letter-spacing: 2px;
      text-shadow: 0 0 18px #0ffad6;
      font-weight: 800;
    }
    .subtitle {
      font-size: 12px;
      color: #93eaf7;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.77;
    }
    #message {
      font-size: 16px;
      margin-bottom: 25px;
      color: #b0ffcc;
      font-weight: 500;
    }
    #startBtn {
      padding: 16px 50px;
      font-size: 15px;
      border-radius: 9px;
      border: none;
      background: linear-gradient(90deg, #16a34a, #06b6d4);
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 1.4px;
      cursor: pointer;
      margin-bottom: 19px;
      box-shadow: 0 0 11px #09f45877;
      transition: box-shadow 0.2s, background 0.2s;
      display: inline-block;
      outline: none;
    }
    #startBtn:hover {
      box-shadow: 0 0 18px #00ff88aa;
      background: linear-gradient(90deg, #34d28d, #00ff88);
    }
    #startBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      font-size: 14px;
      min-height: 30px;
      color: #06b6d4;
      text-align: center;
      letter-spacing: 0.7px;
      font-weight: 600;
    }
    .bar {
      width: 100%;
      height: 10px;
      background: rgba(6, 182, 212, 0.14);
      border-radius: 9px;
      overflow: hidden;
      margin-top: 22px;
      display: none;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.2);
    }
    .bar > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #16a34a, #06b6d4);
      transition: width 100ms linear;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.5), 0 0 3px rgba(22, 163, 74, 0.4);
    }
    .hand-container {
      margin: 33px auto;
      width: 325px;
      height: 400px;
      display: none;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .scanner-frame {
      position: absolute;
      width: 350px;
      height: 415px;
      border: 2px solid #06b6d4;
      border-radius: 17px;
      display: none;
      animation: frameGlow 1.8s infinite;
    }
    @keyframes frameGlow {
      0%, 100% {
        box-shadow: 0 0 16px #06b6d433;
      }
      50% {
        box-shadow: 0 0 32px #14ffe6cc;
      }
    }
    .hand-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 31px #12ffab77) drop-shadow(0 0 27px #06b6d455);
    }
    /* Shining scanning line */
    .scan-line {
      stroke: url(#scanGradient);
      stroke-width: 11;
      stroke-linecap: round;
      opacity: 0.95;
      animation: scanLine 2.5s linear infinite;
      filter: drop-shadow(0 0 7px #06b6d4);
    }
    @keyframes scanLine {
      0% {
        transform: translateY(-40px);
      }
      100% {
        transform: translateY(320px);
      }
    }
    .sensor-spot {
      animation: sensorGlow 2.6s infinite alternate;
    }
    @keyframes sensorGlow {
      0%, 100% {
        opacity: 0.65;
        filter: drop-shadow(0px 0px 7px #00ff88b7);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0px 0px 16px #00ff88e7);
      }
    }
    .tech-info {
      margin-top: 23px;
      display: flex;
      justify-content: space-around;
      font-size: 12px;
      color: #84e6ca;
    }
    .tech-item {
      text-align: center;
    }
    .tech-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
      margin-bottom: 2px;
    }
    .tech-value {
      font-size: 14px;
      color: #00ff88;
      font-weight: bold;
      text-shadow: 0 0 15px #00ff88a0;
    }
    .tech-value.animated {
      animation: valueGlow 1.8s infinite alternate;
    }
    @keyframes valueGlow {
      0%, 100% {
        color: #1ee6c2;
      }
      50% {
        color: #00ff88;
      }
    }
    /* Modal video */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.96);
      display: flex;
      justify-content: center; align-items: center;
      z-index: 10000;
      animation: fadeIn 0.4s;
      backdrop-filter: blur(5px);
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
    .modal {
      background: rgba(10, 20, 38, 0.98);
      border: 2.5px solid #06b6d4;
      border-radius: 17px;
      padding: 40px;
      text-align: center;
      position: relative;
      max-width: 96%;
      box-shadow: 0 0 60px #00f7c4cc, inset 0 0 25px #06b6d469;
    }
    .modal h3 {
      color: #00ff88;
      margin-bottom: 25px;
      font-size: 24px;
      text-shadow: 0 0 15px #16a34a;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .modal iframe {
      width: 100%;
      max-width: 600px;
      height: 345px;
      border-radius: 10px;
      border: 2px solid #06b6d4;
      margin: 20px 0;
      background: #000;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }
    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 32px;
      color: #06b6d4;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .close-btn:hover {
      color: #16a34a;
      transform: scale(1.3) rotate(90deg);
    }
    @media (max-width: 480px) {
      .card { padding: 35px 25px; max-width: 95%; }
      h1 { font-size: 24px; }
      .hand-container { width: 220px; height: 280px; }
      .scanner-frame { width: 240px; height: 300px; }
      .modal { padding: 25px; }
      .modal iframe { height: 220px; }
    }
  </style>
</head>
<body>
  <canvas id="space-bg"></canvas>

  <div class="astrology-bg">
    <div class="zodiac zodiac1">♈</div><div class="zodiac zodiac2">♉</div><div class="zodiac zodiac3">♊</div>
    <div class="zodiac zodiac4">♋</div><div class="zodiac zodiac5">♌</div><div class="zodiac zodiac6">♍</div>
    <div class="zodiac zodiac7">♎</div><div class="zodiac zodiac8">♏</div>
    <div class="orbit orbit1"></div><div class="orbit orbit2"></div>
    <svg class="constellation constellation1" viewBox="0 0 190 190"><line x1="20" y1="28" x2="70" y2="46"/><line x1="70" y1="46" x2="138" y2="37"/><line x1="138" y1="37" x2="172" y2="94"/><circle cx="20" cy="28" r="4"/><circle cx="70" cy="46" r="4"/><circle cx="138" cy="37" r="4"/><circle cx="172" cy="94" r="4"/></svg>
    <svg class="constellation constellation2" viewBox="0 0 190 190"><line x1="33" y1="170" x2="101" y2="121"/><line x1="101" y1="121" x2="135" y2="55"/><circle cx="33" cy="170" r="4"/><circle cx="101" cy="121" r="4"/><circle cx="135" cy="55" r="4"/></svg>
    <svg class="constellation constellation3" viewBox="0 0 190 190"><line x1="67" y1="36" x2="155" y2="44"/><line x1="155" y1="44" x2="172" y2="122"/><circle cx="67" cy="36" r="4"/><circle cx="155" cy="44" r="4"/><circle cx="172" cy="122" r="4"/></svg>
    <svg class="constellation constellation4" viewBox="0 0 190 190"><line x1="49" y1="90" x2="133" y2="140"/><circle cx="49" cy="90" r="4"/><circle cx="133" cy="140" r="4"/></svg>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-header">
        <div class="scanner-label">Biometric Scanner</div>
        <h1>FUTURE SCANNER</h1>
        <div class="subtitle">Advanced Predictive System v2.1</div>
      </div>

      <div id="message">To see your future, put your palm on the camera and click START</div>
      <button id="startBtn">➤ START SCAN</button>
      <div id="status"></div>

      <div class="hand-container" id="handContainer">
        <div class="scanner-frame" id="scannerFrame"></div>
        <svg class="hand-svg" viewBox="0 0 330 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="scanGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0"/>
              <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1"/>
              <stop offset="100%" style="stop-color:#00ff88;stop-opacity:0"/>
            </linearGradient>
            <filter id="handshadow"><feGaussianBlur stdDeviation="8" /></filter>
            <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <path d="M140 330 Q170 382 210 330 L230 110 Q245 60 225 65 L225 330 Q170 390 110 330 Q90 70 130 110 L130 330 Z" fill="#156c47" filter="url(#handshadow)" stroke="#09ffaa" stroke-width="3"/>
          <rect x="115" y="40" width="30" height="115" rx="20" fill="#1ea26c" stroke="#09ffaa" stroke-width="3"/>
          <rect x="135" y="17" width="38" height="122" rx="22" fill="#19b07e" stroke="#09ffaa" stroke-width="3"/>
          <rect x="168" y="10" width="36" height="125" rx="19" fill="#16d48a" stroke="#0cf" stroke-width="2"/>
          <rect x="198" y="24" width="33" height="138" rx="20" fill="#19b07e" stroke="#09ffaa" stroke-width="3"/>
          <rect x="225" y="55" width="26" height="120" rx="14" fill="#1ea26c" stroke="#09ffaa" stroke-width="3"/>
          <path d="M140 210 Q170 220 175 300" stroke="#45e6d4" stroke-width="8" opacity="0.9"/>
          <path d="M170 170 Q172 185 187 193" stroke="#30f8b1" stroke-width="4" opacity="0.8"/>
          <path d="M210 145 Q187 181 195 193" stroke="#30f8b1" stroke-width="4" opacity="0.8"/>
          <circle class="sensor-spot" cx="190" cy="180" r="7" fill="#00ff88"/>
          <circle class="sensor-spot" cx="160" cy="110" r="6" fill="#06b6d4"/>
          <circle class="sensor-spot" cx="213" cy="132" r="5.8" fill="#ffd700"/>
          <circle class="sensor-spot" cx="135" cy="230" r="7" fill="#00ff88"/>
          <circle class="sensor-spot" cx="190" cy="260" r="7" fill="#ffd700"/>
          <line id="scanLine" class="scan-line" x1="120" y1="50" x2="230" y2="50"/>
        </svg>
      </div>

      <div class="bar"><div id="barFill"></div></div>

      <div class="tech-info" id="techInfo" style="display:none;">
        <div class="tech-item"><div class="tech-label">Resolution</div><div class="tech-value animated">1080p</div></div>
        <div class="tech-item"><div class="tech-label">Status</div><div class="tech-value animated">Active</div></div>
        <div class="tech-item"><div class="tech-label">Accuracy</div><div class="tech-value animated">99%</div></div>
      </div>
    </div>
  </div>

  <script>
    // Star twinkle effect
    const canvas = document.getElementById('space-bg'), ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    const stars = [];
    for (let i = 0; i < 180; i++) {
      stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.3+0.3, opacity: Math.random()*0.5+0.2, tSpeed: Math.random()*0.02+0.004});
    }
    function drawStars() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      stars.forEach(star => {
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${star.opacity})`;
        ctx.shadowColor = '#aef6fe'; ctx.shadowBlur = 11; ctx.fill();
        star.opacity += (Math.random()-0.5)*star.tSpeed;
        if(star.opacity>0.82) star.opacity=0.82;
        if(star.opacity<0.15) star.opacity=0.15;
      });
      ctx.shadowBlur=0;
      requestAnimationFrame(drawStars);
    }
    drawStars();

    // UI Logic
    const startBtn = document.getElementById('startBtn'), message = document.getElementById('message'),
      status = document.getElementById('status'), progressBar = document.querySelector('.bar'),
      barFill = document.getElementById('barFill'), handContainer = document.getElementById('handContainer'),
      scannerFrame = document.getElementById('scannerFrame'), techInfo = document.getElementById('techInfo');

    const videos = [
      'https://youtu.be/ULpLvPu3aU0?si=YEPnngZ-P5Tmji-8',
      'https://youtu.be/dOtMlUmTQm4?si=VgdtYxMrz7uHbApU'
    ];

    function startScan() {
      message.textContent = '';
      status.innerHTML = '<strong>Put your palm on the camera...</strong>';
      progressBar.style.display = 'none';
      handContainer.style.display = 'none'; techInfo.style.display = 'none';

      setTimeout(() => {
        status.textContent = 'Scanning palm...';
        progressBar.style.display = 'block'; barFill.style.width = '0%';
        handContainer.style.display = 'flex'; scannerFrame.classList.add('active'); techInfo.style.display = 'flex';
        const startTime = Date.now(), scanDuration = 10000;
        const scanInterval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const percent = Math.min(100, Math.floor((elapsed/scanDuration)*100));
          barFill.style.width = percent + '%';
          status.textContent = `Scanning palm... ${percent}%`;
          if (percent >= 100) clearInterval(scanInterval);
        }, 90);
        setTimeout(() => {
          status.textContent = 'Uploading data...';
          handContainer.style.display = 'none'; scannerFrame.classList.remove('active');
          setTimeout(() => {
            status.textContent = 'Analyzing future...';
            setTimeout(() => { showVideo(); }, 3000);
          }, 3000);
        }, 10000);
      }, 1500);
    }

    function showVideo() {
      const randomVideo = videos[Math.floor(Math.random()*videos.length)];
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      const modal = document.createElement('div');
      modal.className = 'modal';
      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-btn';
      closeBtn.innerHTML = '✕';
      closeBtn.onclick = () => { overlay.remove(); resetScanner(); };
      const caption = document.createElement('div');
      caption.className = 'astro-caption';
      caption.textContent = 'Astrological prediction analysis';
      const title = document.createElement('h3');
      title.textContent = 'Your Future Revealed';
      const iframe = document.createElement('iframe');
      iframe.src = `https://www.youtube.com/embed/${extractVideoId(randomVideo)}?autoplay=1`;
      iframe.frameborder = '0';
      iframe.allow = 'autoplay; encrypted-media';
      iframe.allowFullscreen = true;
      modal.appendChild(closeBtn);
      modal.appendChild(caption);
      modal.appendChild(title);
      modal.appendChild(iframe);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      message.textContent = '';
      status.textContent = '';
      progressBar.style.display = 'none';
    }

    function extractVideoId(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return match && match[2].length === 11 ? match[2] : null;
    }

    function resetScanner() {
      message.textContent = 'To see your future, put your palm on the camera and click START';
      status.textContent = '';
      progressBar.style.display = 'none';
      barFill.style.width = '0%';
      handContainer.style.display = 'none';
      scannerFrame.classList.remove('active');
      techInfo.style.display = 'none';
      startBtn.disabled = false;
      startBtn.style.opacity = '1';
    }

    startBtn.addEventListener('click', () => {
      startBtn.disabled = true;
      startBtn.style.opacity = '0.6';
      startScan();
    });

    resetScanner();
  </script>
</body>
</html>
